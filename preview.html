<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本音ルーム（プレビュー）</title>

<style>
body {
  font-family: sans-serif;
  background:#e7e1d8;
  margin:0;
  padding:20px;
}

.header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.btn {
  background:#c4622d;
  color:#fff;
  padding:10px 16px;
  border:none;
  cursor:pointer;
}

.search {
  width:100%;
  padding:16px;
  font-size:20px;
  margin:20px 0;
}

.post {
  background:#fff;
  padding:16px;
  margin-bottom:10px;
  border-left:4px solid #c4622d;
}

.name {
  color:#c4622d;
  cursor:pointer;
  font-weight:bold;
}

textarea {
  width:100%;
  height:80px;
  margin-top:10px;
}

</style>
</head>

<body>

<div class="header">
  <div>本音ルーム</div>
  <button class="btn" onclick="goLogin()">無料で始める</button>
</div>

<h2>女性限定の匿名コミュニティ「本音ルーム」を少しだけ体験できます</h2>

<div>
  <button class="btn" onclick="goLogin()">✏️ つぶやく</button>
  <button class="btn" onclick="goLogin()">💬 相談する</button>
</div>

<input class="search" placeholder="キーワードで検索..." />

<div id="list"></div>

<script>

function goLogin(){
  location.href = "https://app.honneroom.com/";
}

function nl2br(str){
  return str.replace(/\\n/g,"<br>");
}

const posts = [
{
name:"miii",
icon:"https://app.honneroom.com/data/icon/icon02.png",
text:`彼氏と付き合って2年、同棲の話が出てるんだけど正直まだ踏み切れない。。
仕事も転職活動中で、今環境変えすぎるの怖くて。
同じくらいの年齢で同棲始めた人いたら、決め手が何だったか聞きたいです🥺`
},
{
name:"ゆうう",
icon:"https://app.honneroom.com/data/icon/icon01.png",
text:`もう彼氏いない歴2年になっちまう…
田舎出身だから地元の子が続々と結婚し始めて焦る😭`
},
{
name:"hana",
icon:"https://app.honneroom.com/data/icon/icon00.png",
text:`マチアプ初めて1年、結局一人も付き合えてない。。`
}
];

function render(){
  const el = document.getElementById("list");
  el.innerHTML = "";

  posts.forEach(p=>{
    el.innerHTML += `
    <div class="post">
      <div>
        <img src="${p.icon}" width="30">
        <span class="name" onclick="goLogin()">${p.name}</span>
      </div>
      <div>${nl2br(p.text)}</div>

      <textarea placeholder="返信を入力してください..."></textarea>
      <button class="btn" onclick="goLogin()">返信する</button>
    </div>
    `;
  });
}

render();

</script>

</body>
</html>
