    return '<button class="cat-chip' + (state.category === c.value ? ' active' : '') + '" data-cat="' + esc(c.value) + '">' + esc(c.label) + '</button>';
  }).join('');
  $$('#typeFilter [data-type]').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(btn.dataset.loginOnly === '1'){ goLogin(); return; }
      state.type = btn.dataset.type; renderFilters(); renderHomeList();
    });
  });
  $$('#catFilter [data-cat]').forEach(function(btn){
    btn.addEventListener('click', function(){ state.category = btn.dataset.cat; renderFilters(); renderHomeList(); });
  });
}
function cardHtml(p){
  return '<article class="post-card ' + (p.type === 'consult' ? 'is-question' : 'is-post') + '" data-open="' + esc(p.id) + '">' +
    '<div class="card-head">' +
      '<div class="card-head-left">' + avatarHtml(p.user) +
        '<div class="user-meta">' +
          '<div class="uname-link pop-link" data-user="' + esc(p.id) + '">' + esc(p.user.name) + '</div>' +
          (p.category ? ('<div class="attr-tags"><span class="attr-tag">' + esc(p.category) + '</span></div>') : '') +
        '</div>' +
      '</div>' +
      '<div class="card-head-right">' + typeBadgeHtml(p.type) + '</div>' +
    '</div>' +
    '<div class="card-body">' + nl2br(p.body) + '</div>' +
    '<div class="card-footer"><span>💬 ' + p.replies + '件の返信</span><span>' + esc(p.time) + '</span></div>' +
    buildReactionRow(p.reactions, true) +
  '</article>';
}
function renderHomeList(){
  const list = filteredPosts();
  $('#homeList').innerHTML = list.map(cardHtml).join('');
  $$('[data-open]').forEach(function(card){
    card.addEventListener('click', function(e){ if(e.target.closest('.pop-link') || e.target.closest('[data-login]')) return; openDetail(card.dataset.open); });
  });
  $$('.pop-link').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); openPopover(el); }); });
  $$('[data-login]').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); goLogin(); }); });
}
function openPopover(el){
  closePopover();
  const post = posts.find(function(p){ return p.id === el.dataset.user; });
  if(!post) return;
  const pop = document.createElement('div');
  pop.className = 'user-popover';
  pop.innerHTML = '<button class="popover-close">×</button><div class="popover-header">' + avatarHtml(post.user) + '<span class="popover-name">' + esc(post.user.name) + '</span></div><div class="popover-attrs">' + post.user.attrs.map(function(a){ return '<span class="popover-attr">' + esc(a) + '</span>'; }).join('') + '</div><a class="popover-link" href="' + LOGIN_URL + '">プロフィールを見る →</a>';
  document.body.appendChild(pop);
  const rect = el.getBoundingClientRect();
  pop.style.top = (rect.bottom + 6) + 'px';
  pop.style.left = Math.max(8, Math.min(rect.left, window.innerWidth - 300)) + 'px';
  pop.querySelector('.popover-close').addEventListener('click', function(){ closePopover(); });
  window._popover = pop;
}
function closePopover(){ if(window._popover){ window._popover.remove(); window._popover = null; } }
document.addEventListener('click', function(e){ if(window._popover && !window._popover.contains(e.target) && !e.target.closest('.pop-link')){ closePopover(); } });
function openDetail(id){
  const p = posts.find(function(x){ return x.id === id; });
  if(!p) return;
  $('#homeListView').style.display = 'none';
  $('#homeDetail').classList.add('show');
  const replies = detailReplies[id] || [];
  const reply = replies[0];
  let html = '<button class="back-btn" id="backBtn">← 一覧に戻る</button><div class="dcard"><div class="card-head"><div class="card-head-left">' + avatarHtml(p.user) + '<div class="user-meta"><div class="uname-link pop-link" data-user="' + esc(p.id) + '">' + esc(p.user.name) + '</div></div></div><div class="card-head-right">' + (p.category ? ('<span class="attr-tag">' + esc(p.category) + '</span> ') : '') + typeBadgeHtml(p.type) + '</div></div><div class="dbody">' + nl2br(p.body) + '</div><div class="dfooter"><span>' + esc(p.time) + '</span></div>' + buildReactionRow(p.reactions, false) + '</div><div class="reply-form-box"><div class="reply-form-lbl">返信する</div><textarea class="reply-box" id="replyBox" placeholder="返信を入力してください..."></textarea><div class="reply-hint">テキスト入力はできますが、送信には無料登録が必要です。</div><div class="reply-actions"><button class="btn-primary" data-login>返信する</button><span class="reply-count"><span id="replyCount">0</span>/' + REPLY_MAX + '</span></div></div><div class="sec-divider">返信 (' + replies.length + ')</div>';
  if(reply){
    html += '<div class="rcard"><div class="reply-head"><div class="card-head-left">' + avatarHtml(reply.user) + '<div class="user-meta"><div class="uname-link">' + esc(reply.user.name) + '</div></div></div><div class="reply-time">' + esc(reply.time) + '</div></div><div class="rbody">' + nl2br(reply.body) + '</div>' + buildReactionRow(reply.reactions, false) + '</div>';
  }
  $('#homeDetail').innerHTML = html;
  $('#backBtn').addEventListener('click', showHomeList);
  const replyBox = $('#replyBox'); const replyCount = $('#replyCount');
  if(replyBox && replyCount){
    replyBox.addEventListener('input', function(){ if(replyBox.value.length > REPLY_MAX){ replyBox.value = replyBox.value.slice(0, REPLY_MAX); } replyCount.textContent = replyBox.value.length; });
  }
  $$('.pop-link').forEach(function(el){ el.addEventListener('click', function(e){ e.stopPropagation(); openPopover(el); }); });
  $$('[data-login]').forEach(function(el){ el.addEventListener('click', goLogin); });
}
function showHomeList(){ $('#homeDetail').classList.remove('show'); $('#homeDetail').innerHTML = ''; $('#homeListView').style.display = ''; }
function switchTab(tab){ if(tab === 'mypage' || tab === 'account'){ goLogin(); return; } $$('.tab-btn').forEach(function(btn){ btn.classList.toggle('active', btn.dataset.tab === tab); }); $$('.tab-pane').forEach(function(pane){ pane.classList.toggle('active', pane.id === 'tab-' + tab); }); showHomeList(); }
async function guardLoggedIn(){ try{ const res = await sb.auth.getSession(); const session = res && res.data && res.data.session; if(session && session.user){ location.replace(APP_URL); } }catch(e){} }
function bindGlobal(){
  $$('.tab-btn').forEach(function(btn){ btn.addEventListener('click', function(){ switchTab(btn.dataset.tab); }); });
  $('#homeSearch').addEventListener('input', function(e){ state.search = e.target.value.trim(); renderHomeList(); });
  $('#clearSearchBtn').addEventListener('click', function(){ state.search = ''; $('#homeSearch').value = ''; renderHomeList(); });
  $('#headerStartBtn').addEventListener('click', goLogin);
  $('#openPostBtn').addEventListener('click', goLogin);
  $('#openConsultBtn').addEventListener('click', goLogin);
}
(async function init(){ await guardLoggedIn(); renderFilters(); renderHomeList(); bindGlobal(); })();
</script>
</body>
</html>
