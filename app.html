<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>本音ルーム</title>
<link rel="icon" type="image/png" href="/assets/icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#c4622d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="本音ルーム">
<link rel="apple-touch-icon" href="/assets/icon.png">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600;700&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-N8N26KRS9P"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-N8N26KRS9P', { linker: { domains: ['honneroom.com','app.honneroom.com'] } });
</script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1714;--cream:#f5f0e8;--warm:#e8dfd0;
  --primary:#c4622d;--primary-light:#d4845a;--primary-pale:#f0ddd3;
  --mist:#8a7a72;--error:#b3261e;
  --hh:60px;--nh:52px;
}
html,body{min-height:100vh}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--ink);padding-top:calc(var(--hh) + var(--nh))}

/* HEADER */
.site-header{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:100;background:rgba(245,240,232,.96);backdrop-filter:blur(12px);border-bottom:1px solid rgba(26,23,20,.08);display:flex;align-items:center;padding:0 20px;justify-content:space-between}
.hlogo{display:flex;align-items:center;gap:9px;text-decoration:none}
.hlogo img{width:30px;height:30px;object-fit:contain}
.hlogo-name{font-family:'Shippori Mincho',serif;font-size:15px;font-weight:600;color:var(--ink)}
.hright{display:flex;align-items:center;gap:10px}
.uemail{font-size:12px;color:var(--mist);max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pbadge{font-size:10px;padding:3px 9px;background:var(--primary-pale);color:var(--primary);letter-spacing:.06em}
.pbadge.std{background:var(--primary);color:white}
.btn-out{font-size:12px;color:var(--mist);background:none;border:1px solid rgba(26,23,20,.12);padding:5px 11px;cursor:pointer;transition:all .2s;font-family:'DM Sans',sans-serif}
.btn-out:hover{color:var(--ink);border-color:var(--ink)}
.btn-login-link{font-size:12px;color:var(--primary);background:var(--primary-pale);border:1px solid rgba(196,98,45,.2);padding:5px 11px;cursor:pointer;text-decoration:none;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-login-link:hover{background:var(--primary);color:white}

/* TAB NAV */
.tab-nav{position:fixed;top:var(--hh);left:0;right:0;height:var(--nh);z-index:99;background:white;border-bottom:1px solid rgba(26,23,20,.08);display:flex;align-items:stretch}
.tab-btn{flex:1;border:none;background:none;font-family:'DM Sans',sans-serif;font-size:13px;letter-spacing:.04em;color:var(--mist);cursor:pointer;position:relative;transition:color .2s;font-weight:400}
.tab-btn::after{content:'';position:absolute;bottom:0;left:0;right:0;height:3px;background:var(--primary);transform:scaleX(0);transition:transform .2s}
.tab-btn.active{color:var(--primary);font-weight:600}
.tab-btn.active::after{transform:scaleX(1)}

/* PAGE */
.page{max-width:680px;margin:0 auto;padding:24px 16px 80px}
.tab-pane{display:none}
.tab-pane.active{display:block}

/* ENTRY FORM */
.entry-hero{text-align:center;padding:20px 0 20px}
.entry-hero-title{font-family:'Shippori Mincho',serif;font-size:22px;font-weight:600;color:var(--ink);margin-bottom:10px;line-height:1.5}
.entry-hero-sub{font-size:13px;color:var(--mist);font-weight:300;line-height:1.9}
.entry-form-wrap{background:white;border:1px solid rgba(26,23,20,.06);padding:24px;margin-bottom:12px}
.entry-textarea{width:100%;min-height:200px;padding:14px 16px;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:300;color:var(--ink);background:var(--cream);border:1px solid rgba(26,23,20,.12);outline:none;resize:vertical;line-height:1.9;transition:border-color .2s,box-shadow .2s;border-radius:0;-webkit-appearance:none}
.entry-textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(196,98,45,.1);background:white}
.entry-textarea::placeholder{color:#b0a898}
.entry-form-footer{display:flex;align-items:center;justify-content:space-between;margin-top:8px;flex-wrap:wrap;gap:8px}
.entry-count{font-size:12px;color:var(--mist)}
.guest-notice{font-size:12px;color:var(--mist);font-weight:300}
.guest-notice a{color:var(--primary);text-decoration:none;font-weight:400}
.guest-notice a:hover{text-decoration:underline}
.btn-analyze{background:var(--primary);color:white;border:none;padding:14px 32px;font-family:'DM Sans',sans-serif;font-size:15px;letter-spacing:.04em;cursor:pointer;transition:all .2s;width:100%;margin-top:16px;display:flex;align-items:center;justify-content:center;gap:8px}
.btn-analyze:hover:not(:disabled){background:var(--ink)}
.btn-analyze:disabled{opacity:.4;cursor:not-allowed}

/* ANALYSIS RESULT */
.result-back{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mist);background:none;border:none;cursor:pointer;padding:0;margin-bottom:20px;font-family:'DM Sans',sans-serif;transition:color .2s}
.result-back:hover{color:var(--primary)}
.result-card{background:white;border:1px solid rgba(26,23,20,.06);padding:20px;margin-bottom:8px}
.result-label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--primary);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.result-label::after{content:'';flex:1;height:1px;background:var(--primary);opacity:.2}
.core-emotion-text{font-family:'Shippori Mincho',serif;font-size:17px;font-weight:600;color:var(--ink);line-height:1.8}
.summary-text{font-size:14px;color:var(--ink);font-weight:300;line-height:1.8;background:var(--cream);padding:14px 16px;border-left:3px solid var(--primary)}
.emotion-chips{display:flex;flex-wrap:wrap;gap:8px}
.emotion-chip{display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 14px;border-radius:8px;min-width:70px;text-align:center}
.emotion-chip-name{font-weight:500;color:white;font-size:13px}
.emotion-chip-cat{font-size:10px;color:rgba(255,255,255,.75)}
.emotion-chip-dots{font-size:10px;color:rgba(255,255,255,.9);letter-spacing:1px;margin:1px 0}
.distortion-list{display:flex;flex-direction:column;gap:8px}
.distortion-item{background:var(--cream);padding:12px 14px}
.distortion-type{font-size:12px;font-weight:600;color:var(--primary);margin-bottom:4px}
.distortion-desc{font-size:13px;color:var(--ink);font-weight:300;line-height:1.7}
.reframe-text{font-size:14px;color:var(--ink);font-weight:300;line-height:1.9;white-space:pre-wrap;background:var(--primary-pale);padding:16px;border-left:3px solid var(--primary)}
.reframe-locked{text-align:center;padding:20px;color:var(--mist);font-size:13px;font-weight:300;line-height:1.8;background:var(--warm)}
.reframe-locked .upg-btn{display:inline-block;margin-top:12px;font-size:13px;color:white;background:var(--primary);padding:8px 20px;text-decoration:none;cursor:pointer;transition:background .2s}
.reframe-locked .upg-btn:hover{background:var(--ink)}
.save-notice{background:var(--warm);border:1px solid rgba(26,23,20,.08);padding:14px 16px;font-size:13px;color:var(--mist);font-weight:300;line-height:1.7;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px}
.save-notice-icon{font-size:16px;flex-shrink:0;margin-top:1px}
.save-notice a{color:var(--primary);text-decoration:none;font-weight:400}
.save-notice a:hover{text-decoration:underline}
.save-saved{background:#f0fdf4;border:1px solid rgba(52,168,83,.2);padding:12px 16px;font-size:13px;color:#166534;font-weight:400;margin-bottom:8px}
.btn-again{width:100%;padding:12px;background:none;border:1px solid rgba(26,23,20,.12);font-family:'DM Sans',sans-serif;font-size:14px;color:var(--mist);cursor:pointer;transition:all .2s;margin-top:4px}
.btn-again:hover{border-color:var(--primary);color:var(--primary)}

/* ENTRIES LIST */
.entries-list{display:flex;flex-direction:column;gap:6px}
.entry-card{background:white;border:1px solid rgba(26,23,20,.06);border-left:4px solid var(--primary-pale);padding:16px;cursor:pointer;transition:all .2s}
.entry-card:hover{border-left-color:var(--primary);transform:translateX(2px)}
.entry-card-date{font-size:11px;color:var(--mist);margin-bottom:6px}
.entry-card-core{font-size:13px;font-weight:500;color:var(--primary);margin-bottom:6px;line-height:1.5}
.entry-card-body{font-size:13px;color:var(--mist);font-weight:300;line-height:1.6;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.entry-card-summary{font-size:12px;color:var(--ink);font-weight:300;margin-top:8px;background:var(--cream);padding:6px 10px}

/* DETAIL VIEW */
.detail-view{display:none}
.detail-view.show{display:block}
.back-btn{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--mist);background:none;border:none;cursor:pointer;padding:0;margin-bottom:20px;font-family:'DM Sans',sans-serif;transition:color .2s}
.back-btn:hover{color:var(--primary)}

/* LOGIN PROMPT */
.login-prompt{background:white;border:1px solid rgba(26,23,20,.06);padding:40px 24px;text-align:center}
.login-prompt-h{font-family:'Shippori Mincho',serif;font-size:19px;font-weight:600;color:var(--ink);margin-bottom:10px}
.login-prompt-body{font-size:13px;color:var(--mist);font-weight:300;line-height:1.8;margin-bottom:22px}
.login-prompt-hint{font-size:12px;color:var(--mist);font-weight:300;margin-top:14px;line-height:1.7}

/* ACCOUNT */
.asec{background:white;border:1px solid rgba(26,23,20,.06);padding:24px;margin-bottom:8px}
.asec-h{font-family:'Shippori Mincho',serif;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid rgba(26,23,20,.08)}
.plan-box{background:var(--warm);padding:14px 18px;margin-bottom:14px}
.plan-box-lbl{font-size:11px;color:var(--mist);letter-spacing:.04em;margin-bottom:3px}
.plan-box-val{font-family:'Shippori Mincho',serif;font-size:20px;font-weight:600}
.fg{margin-bottom:16px}
.flbl{display:block;font-size:11px;color:var(--mist);letter-spacing:.06em;margin-bottom:6px;text-transform:uppercase}
.fi,.fta{width:100%;padding:11px 14px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:300;color:var(--ink);background:var(--cream);border:1px solid rgba(26,23,20,.12);outline:none;transition:border-color .2s,box-shadow .2s;border-radius:0;-webkit-appearance:none}
.fi:focus,.fta:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(196,98,45,.1);background:white}
.fta{resize:vertical;min-height:80px;line-height:1.7}
.pwf{max-width:300px;display:flex;flex-direction:column;gap:8px;margin-top:10px}
.btn-p{background:var(--primary);color:white;border:none;padding:12px 32px;font-family:'DM Sans',sans-serif;font-size:14px;letter-spacing:.04em;cursor:pointer;transition:all .2s}
.btn-p:hover:not(:disabled){background:var(--ink);transform:translateY(-1px)}
.btn-p:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-s{background:transparent;color:var(--primary);border:1px solid var(--primary);padding:11px 26px;font-family:'DM Sans',sans-serif;font-size:14px;letter-spacing:.04em;cursor:pointer;transition:all .2s}
.btn-s:hover{background:var(--primary);color:white}
.btn-d{background:transparent;color:var(--error);border:1px solid var(--error);padding:11px 26px;font-family:'DM Sans',sans-serif;font-size:14px;cursor:pointer;transition:all .2s}
.btn-d:hover{background:var(--error);color:white}
.fmsg{font-size:13px;margin-top:10px;font-weight:300}
.fmsg.err{color:var(--error)}
.fmsg.ok{color:var(--primary)}

/* PLAN COMPARISON TABLE */
.plan-table{width:100%;border-collapse:collapse;margin:14px 0;font-size:13px}
.plan-table th{background:var(--warm);padding:9px 10px;text-align:left;font-size:11px;letter-spacing:.06em;color:var(--mist);font-weight:400;border:1px solid rgba(26,23,20,.08)}
.plan-table td{padding:9px 10px;border:1px solid rgba(26,23,20,.06);color:var(--ink);font-weight:300;vertical-align:middle}
.plan-table .check{color:var(--primary);font-weight:500;text-align:center}
.plan-table .cross{color:var(--mist);opacity:.4;text-align:center}

/* ICON PICKER */
.av-upload-wrap{display:flex;align-items:center;gap:16px;margin-bottom:8px}
.av-preview-lg{width:72px;height:72px;border-radius:50%;overflow:hidden;border:3px solid var(--primary-pale);background:var(--warm);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.av-preview-lg img{width:100%;height:100%;object-fit:cover}
.btn-av{font-size:12px;color:var(--primary);background:none;border:1px solid var(--primary);padding:6px 14px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s}
.btn-av:hover{background:var(--primary);color:white}
.icon-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:none;align-items:center;justify-content:center;padding:20px}
.icon-modal-overlay.show{display:flex}
.icon-modal{background:white;width:min(440px,96vw);max-height:80vh;overflow-y:auto;padding:24px;position:relative;border-top:4px solid var(--primary)}
.icon-modal-title{font-family:'Shippori Mincho',serif;font-size:17px;font-weight:600;color:var(--ink);margin-bottom:16px}
.icon-modal-close{position:absolute;top:12px;right:14px;background:none;border:none;font-size:22px;cursor:pointer;color:var(--mist);padding:4px 8px;line-height:1}
.icon-picker-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.icon-option{position:relative;cursor:pointer}
.icon-option input[type=radio]{position:absolute;opacity:0;width:0;height:0}
.icon-option img{width:100%;aspect-ratio:1;border-radius:50%;border:3px solid transparent;transition:all .2s;display:block;background:var(--warm)}
.icon-option input[type=radio]:checked+img{border-color:var(--primary);box-shadow:0 0 0 2px var(--primary-pale)}
.icon-modal-btns{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid rgba(26,23,20,.06)}

/* MISC */
.loading{display:flex;align-items:center;justify-content:center;padding:48px;color:var(--mist);font-size:13px;letter-spacing:.06em}
.empty{text-align:center;padding:48px 20px;color:var(--mist);font-size:13px;font-weight:300;line-height:1.8}
.empty-h{font-family:'Shippori Mincho',serif;font-size:17px;color:var(--ink);margin-bottom:8px}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.spinner{display:inline-block;animation:spin .8s linear infinite}

/* PWA */
.pwa-banner{display:none;align-items:center;gap:12px;background:white;border:1px solid rgba(196,98,45,.2);border-left:4px solid var(--primary);padding:14px 16px;margin-bottom:20px;position:relative}
.pwa-banner.show{display:flex}
.pwa-banner-icon{font-size:22px;flex-shrink:0}
.pwa-banner-body{flex:1;min-width:0}
.pwa-banner-title{font-size:13px;font-weight:500;color:var(--ink);margin-bottom:2px}
.pwa-banner-desc{font-size:12px;color:var(--mist);font-weight:300;line-height:1.5}
.pwa-banner-btn{background:var(--primary);color:white;border:none;padding:8px 16px;font-family:'DM Sans',sans-serif;font-size:13px;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:background .2s}
.pwa-banner-btn:hover{background:var(--ink)}
.pwa-banner-close{position:absolute;top:8px;right:8px;background:none;border:none;color:var(--mist);font-size:16px;cursor:pointer;padding:2px 6px;line-height:1}
.pwa-modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:none;align-items:flex-end;justify-content:center;padding:0}
.pwa-modal-overlay.show{display:flex}
.pwa-modal{background:white;width:min(480px,100vw);padding:28px 24px 32px;border-top-left-radius:16px;border-top-right-radius:16px;border-top:4px solid var(--primary)}
.pwa-modal-title{font-family:'Shippori Mincho',serif;font-size:18px;font-weight:600;color:var(--ink);margin-bottom:6px}
.pwa-modal-sub{font-size:13px;color:var(--mist);font-weight:300;margin-bottom:20px;line-height:1.6}
.pwa-steps{display:flex;flex-direction:column;gap:12px;margin-bottom:20px}
.pwa-step{display:flex;align-items:flex-start;gap:12px}
.pwa-step-num{width:24px;height:24px;border-radius:50%;background:var(--primary);color:white;font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.pwa-step-text{font-size:13px;color:var(--ink);line-height:1.7;font-weight:300}
.pwa-step-text strong{font-weight:500;color:var(--primary)}
.pwa-modal-close{width:100%;padding:12px;background:var(--warm);border:none;font-family:'DM Sans',sans-serif;font-size:14px;color:var(--mist);cursor:pointer;transition:background .2s}
.pwa-modal-close:hover{background:var(--ink);color:white}

/* RECORD SUB-TABS */
.rec-tabs{display:flex;border-bottom:1px solid rgba(26,23,20,.08);margin-bottom:16px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-top:2px}
.rec-tab{flex-shrink:0;padding:10px 14px;font-size:12px;color:var(--mist);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;white-space:nowrap;letter-spacing:.04em}
.rec-tab.active{color:var(--primary);border-bottom-color:var(--primary);font-weight:500}
.rec-tab:hover:not(.active){color:var(--ink)}

/* DELETE BUTTON */
.entry-card{position:relative}
.entry-del-btn{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--mist);font-size:14px;cursor:pointer;padding:3px 7px;opacity:0;transition:opacity .2s;line-height:1}
.entry-card:hover .entry-del-btn,.entry-card:focus-within .entry-del-btn{opacity:.6}
.entry-del-btn:hover{color:var(--error);opacity:1!important}

/* PREMIUM LOCK */
.premium-lock{background:white;border:1px solid rgba(26,23,20,.06);padding:48px 24px;text-align:center}
.premium-lock-icon{font-size:40px;margin-bottom:14px}
.premium-lock-title{font-family:'Shippori Mincho',serif;font-size:18px;font-weight:600;color:var(--ink);margin-bottom:10px}
.premium-lock-desc{font-size:13px;color:var(--mist);font-weight:300;line-height:1.9;margin-bottom:22px;white-space:pre-line}

/* EMOTION CALENDAR */
.cal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.cal-title{font-family:'Shippori Mincho',serif;font-size:16px;font-weight:600;color:var(--ink)}
.cal-nav-btn{background:none;border:1px solid rgba(26,23,20,.12);padding:5px 11px;font-size:12px;cursor:pointer;color:var(--mist);font-family:'DM Sans',sans-serif;transition:all .2s}
.cal-nav-btn:hover{border-color:var(--primary);color:var(--primary)}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-dow{text-align:center;font-size:10px;color:var(--mist);padding:4px 0;letter-spacing:.06em}
.cal-day{aspect-ratio:1;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;border-radius:4px;transition:background .2s;min-height:34px}
.cal-day.has-entry{cursor:pointer}.cal-day.has-entry:hover{background:var(--warm)}
.cal-day.other-month{visibility:hidden}
.cal-day.today .cal-day-num{color:var(--primary);font-weight:700}
.cal-day-num{line-height:1;font-size:12px;color:var(--ink)}
.cal-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}

/* TREND CHART */
.bar-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.bar-label{font-size:12px;color:var(--ink);min-width:52px;max-width:96px;text-align:right;flex-shrink:0;line-height:1.3}
.bar-track{flex:1;background:var(--warm);height:16px;border-radius:2px;overflow:hidden}
.bar-fill{height:100%;border-radius:2px;display:flex;align-items:center;justify-content:flex-end;padding-right:5px;font-size:10px;color:white;font-weight:500}
.bar-count{font-size:11px;color:var(--mist);width:22px;text-align:right;flex-shrink:0}

/* TYPE CARD */
.type-card{background:white;border:1px solid rgba(26,23,20,.06);padding:28px 24px;margin-bottom:8px;text-align:center;overflow:hidden;position:relative}
.type-card::before{content:'';position:absolute;top:0;left:0;right:0;height:5px;background:var(--type-color,var(--primary))}
.type-card-label{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--mist);margin-bottom:12px}
.type-card-emoji{font-size:60px;line-height:1;margin-bottom:12px}
.type-card-name{font-family:'Shippori Mincho',serif;font-size:26px;font-weight:700;margin-bottom:8px;line-height:1.4}

function rtime(ts){
  const d=(Date.now()-new Date(ts))/1000;
  if(d<60)return"たった今";
  if(d<3600)return`${Math.floor(d/60)}分前`;
  if(d<86400)return`${Math.floor(d/3600)}時間前`;
  if(d<86400*7)return`${Math.floor(d/86400)}日前`;
  const dt=new Date(ts);
  return`${dt.getFullYear()}/${dt.getMonth()+1}/${dt.getDate()}`;
}

function determineType(analysis){
  if(!analysis)return PERSONALITY_TYPES[0];
  const wheel=analysis.emotion_wheel||[];
  if(!wheel.length)return PERSONALITY_TYPES[Math.floor(Date.now()%PERSONALITY_TYPES.length)];
  const sorted=[...wheel].sort((a,b)=>(b.intensity||3)-(a.intensity||3));
  const dominantCat=sorted[0]?.category;
  return PERSONALITY_TYPES.find(t=>t.emotionKeys.includes(dominantCat))
    ||PERSONALITY_TYPES[Math.floor(Date.now()%PERSONALITY_TYPES.length)];
}

function renderEmotionWheel(emotions){
  if(!emotions||!emotions.length)
    return `<div style="color:var(--mist);font-size:13px">感情の分類はありませんでした</div>`;
  return `<div class="emotion-chips">`+emotions.map(e=>{
    const color=EMOTION_COLORS[e.category]||'#8a7a72';
    const filled=Math.min(5,Math.max(1,Math.round(e.intensity||3)));
    const dots='●'.repeat(filled)+'○'.repeat(5-filled);
    return `<div class="emotion-chip" style="background:${color}">
      <div class="emotion-chip-name">${esc(e.emotion)}</div>
      <div class="emotion-chip-dots">${dots}</div>
      <div class="emotion-chip-cat">${esc(e.category)}</div>
    </div>`;
  }).join('')+`</div>`;
}

}

/* ===== 分析実行 ===== */
async function analyzeEntry(){
  const body=$("#entryBody")?.value?.trim();
  if(!body||body.length<10)return;

  const btn=$("#btnAnalyze");
  const msgEl=$("#analyzeMsg");
  btn.disabled=true;
  $("#analyzeBtnText").innerHTML=`<span class="spinner">↻</span> 分析中…`;
  msg(msgEl,"");

  let entry_id=null;

  // ログイン済みならエントリーを先に保存
  if(S.user){
    _cachedEntries=null; // キャッシュ無効化
    const{data:entry,error:eErr}=await sb.from("entries").insert({user_id:S.user.id,body}).select("id").single();
    if(eErr){
      console.error("entry insert error:",eErr);
      msg(msgEl,"記録の保存中にエラーが発生しました。Supabaseのentriesテーブルが作成されているか確認してください。");
      btn.disabled=false;
      $("#analyzeBtnText").textContent="✦ 分析する";
      return;
    }
    entry_id=entry.id;
  }

  // analyze-entry Edge Function を呼ぶ
  let analysis=null;
  try{
    const headers={"Content-Type":"application/json"};
    if(S.user){
      const{data:sess}=await sb.auth.getSession();
      if(sess?.session?.access_token) headers["Authorization"]="Bearer "+sess.session.access_token;
    }
    const payload={body};
    if(entry_id) payload.entry_id=entry_id;
    if(S.user?.id) payload.user_id=S.user.id;

    const res=await fetch(ANALYZE_URL,{method:"POST",headers,body:JSON.stringify(payload)});
    if(!res.ok){
      const errBody=await res.text().catch(()=>"");
      throw new Error(`API ${res.status}: ${errBody}`);
    }
    const data=await res.json();
    analysis=data.analysis;
  }catch(e){
    console.error("analyzeEntry error:",e);

}

/* ===== 記録サブタブ状態 ===== */
let _recTab='list';
let _calYear=new Date().getFullYear();
let _calMonth=new Date().getMonth();
let _cachedEntries=null;

function getDominantEmotion(analyses){
  const a=(analyses||[])[0];
  if(!a?.emotion_wheel?.length)return null;
  return[...a.emotion_wheel].sort((x,y)=>(y.intensity||3)-(x.intensity||3))[0];
}

function premiumLockHtml(icon,title,desc){
  return`<div class="premium-lock">
    <div class="premium-lock-icon">${icon}</div>
    <div class="premium-lock-title">${title}</div>
    <div class="premium-lock-desc">${desc}</div>
    <button class="btn-p" onclick="switchTab('account')">Standardプランにアップグレード →</button>
  </div>`;
}

function switchRecTab(tab){
  _recTab=tab;
  document.querySelectorAll('.rec-tab').forEach(b=>b.classList.toggle('active',b.dataset.rtab===tab));
  document.getElementById('recordDetail').classList.remove('show');
  if(_cachedEntries!=null)renderRecContent(_cachedEntries);
}

function renderRecContent(entries){
  const main=document.getElementById('recordMain');
  main.style.display='';
  document.getElementById('recordDetail').classList.remove('show');
  switch(_recTab){
    case'list':renderRecordList(entries,main);break;
    case'calendar':renderCalendar(entries,main);break;
    case'trend':renderTrend(entries,main);break;
    case'report':renderReport(entries,main);break;
  }
}

async function renderRecord(){

  const detail=document.getElementById("recordDetail");
  detail.classList.remove("show");detail.innerHTML="";

  if(!S.user){

function renderRecordList(entries,main){
  if(!entries.length){
    main.innerHTML=`<div class="empty"><div class="empty-h">まだ記録がありません</div><p>「吐き出す」タブから気持ちを書いてみましょう。</p></div>`;

  }
  main.innerHTML=`<div class="entries-list">`+entries.map(e=>{
    const a=(e.analyses||[])[0]||null;
    const bodyPreview=e.body?.slice(0,80)+(e.body?.length>80?"…":"");

      <div class="entry-card-body">${esc(bodyPreview)}</div>

async function deleteEntry(entryId,e){
  e.stopPropagation();

/* ===== 感情カレンダー ===== */
function renderCalendar(entries,main){
  if(!S.isStd){
    main.innerHTML=premiumLockHtml('📅','感情カレンダー','1ヶ月の感情の変化をカレンダーで可視化します。\n毎日の記録から、あなたの感情パターンを発見できます。');
    return;
  }
  // 日付→色マップ
  const dateMap={};
  entries.forEach(e=>{
    const d=new Date(e.created_at);
    const key=`${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
    if(!dateMap[key]){
      const dom=getDominantEmotion(e.analyses);
      dateMap[key]=dom?(EMOTION_COLORS[dom.category]||'#8a7a72'):'#8a7a72';
    }
  });
  const year=_calYear,month=_calMonth;
  const firstDay=new Date(year,month,1);
  const totalDays=new Date(year,month+1,0).getDate();
  const startDow=(firstDay.getDay()+6)%7;
  const today=new Date();
  let html=`<div class="result-card">
    <div class="cal-header">
      <div class="cal-title">${year}年${month+1}月</div>
      <div style="display:flex;gap:6px">
        <button class="cal-nav-btn" onclick="_calMonth--;if(_calMonth<0){_calMonth=11;_calYear--;}renderCalendar(_cachedEntries,document.getElementById('recordMain'))">◀</button>
        <button class="cal-nav-btn" onclick="_calMonth++;if(_calMonth>11){_calMonth=0;_calYear++;}renderCalendar(_cachedEntries,document.getElementById('recordMain'))">▶</button>
      </div>
    </div>
    <div class="cal-grid">
    ${['月','火','水','木','金','土','日'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}`;
  for(let i=0;i<startDow;i++)html+=`<div class="cal-day other-month"></div>`;
  for(let day=1;day<=totalDays;day++){
    const key=`${year}-${month}-${day}`;
    const color=dateMap[key];
    const isToday=day===today.getDate()&&month===today.getMonth()&&year===today.getFullYear();
    html+=`<div class="cal-day${color?' has-entry':''}${isToday?' today':''}">
      <span class="cal-day-num">${day}</span>
      ${color?`<div class="cal-dot" style="background:${color}"></div>`:''}
    </div>`;
  }
  html+=`</div></div>
  <div class="result-card" style="padding:14px 20px">
    <div class="result-label">感情の色凡例</div>
    <div style="display:flex;flex-wrap:wrap;gap:10px;margin-top:6px">
      ${Object.entries(EMOTION_COLORS).map(([name,color])=>
        `<div style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--mist)">
          <div style="width:9px;height:9px;border-radius:50%;background:${color};flex-shrink:0"></div>${name}
        </div>`).join('')}
    </div>
  </div>`;
  main.innerHTML=html;
}

/* ===== 傾向・パターン分析 ===== */
function renderTrend(entries,main){
  if(!S.isStd){
    main.innerHTML=premiumLockHtml('📊','傾向・パターン分析','感情の出現頻度や思考のクセのパターンを分析します。\n記録が増えるほど、精度が上がります。');
    return;
  }
  if(!entries.length){
    main.innerHTML=`<div class="empty"><div class="empty-h">まだデータが足りません</div><p>記録が増えると傾向が見えてきます。</p></div>`;
    return;
  }
  const emotionCount={},distortionCount={};
  entries.forEach(e=>{
    const a=(e.analyses||[])[0];
    if(!a)return;
    (a.emotion_wheel||[]).forEach(em=>{
      emotionCount[em.category]=(emotionCount[em.category]||0)+(em.intensity||1);
    });
    (a.cognitive_distortions||[]).forEach(d=>{
      distortionCount[d.type]=(distortionCount[d.type]||0)+1;
    });
  });
  const sortedEmo=Object.entries(emotionCount).sort((a,b)=>b[1]-a[1]);
  const maxEmo=sortedEmo[0]?.[1]||1;
  const sortedDis=Object.entries(distortionCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxDis=sortedDis[0]?.[1]||1;
  const weekCounts=[0,0,0,0];
  const now=Date.now();
  entries.forEach(e=>{
    const age=(now-new Date(e.created_at).getTime())/(86400000);
    if(age<7)weekCounts[0]++;else if(age<14)weekCounts[1]++;else if(age<21)weekCounts[2]++;else if(age<28)weekCounts[3]++;
  });
  const maxWk=Math.max(...weekCounts,1);
  // ゼロの時はwidthもmin-widthも0にする
  const barPct=(v,max)=>v===0?'width:0;min-width:0':`width:${Math.round((v/max)*100)}%`;
  let html=`<div class="result-card">
    <div class="result-label">記録の頻度（過去4週間）</div>
    ${['今週','先週','2週前','3週前'].map((lbl,i)=>`
      <div class="bar-row">
        <div class="bar-label">${lbl}</div>
        <div class="bar-track"><div class="bar-fill" style="${barPct(weekCounts[i],maxWk)};background:var(--primary)">${weekCounts[i]>0?weekCounts[i]:''}</div></div>
        <div class="bar-count">${weekCounts[i]}</div>
      </div>`).join('')}
  </div>
  <div class="result-card">
    <div class="result-label">よく感じる感情 TOP${Math.min(5,sortedEmo.length)}</div>
    ${sortedEmo.slice(0,5).map(([cat,val])=>`
      <div class="bar-row">
        <div class="bar-label">${cat}</div>
        <div class="bar-track"><div class="bar-fill" style="${barPct(val,maxEmo)};background:${EMOTION_COLORS[cat]||'#8a7a72'}"></div></div>
        <div class="bar-count">${val}</div>
      </div>`).join('')}
  </div>`;
  if(sortedDis.length){
    // 思考のクセは長いラベルがあるため縦レイアウト
    html+=`<div class="result-card">
      <div class="result-label">よく見られる思考のクセ</div>
      ${sortedDis.map(([type,count])=>`
        <div style="margin-bottom:12px">
          <div style="font-size:12px;color:var(--ink);margin-bottom:5px;font-weight:400">${esc(type)}</div>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="bar-track" style="flex:1"><div class="bar-fill" style="${barPct(count,maxDis)};background:var(--primary)"></div></div>
            <div class="bar-count">${count}回</div>
          </div>
        </div>`).join('')}
    </div>`;
  }
  main.innerHTML=html;
}

/* ===== 月次レポート ===== */
function renderReport(entries,main){
  if(!S.isStd){
    main.innerHTML=premiumLockHtml('📋','月次レポート','毎月の感情の傾向をまとめたレポートです。\n自分の感情の変化を月単位で振り返ることができます。');
    return;
  }
  if(!entries.length){
    main.innerHTML=`<div class="empty"><div class="empty-h">まだデータが足りません</div><p>記録が増えると月次レポートが作成されます。</p></div>`;
    return;
  }
  const monthMap={};
  entries.forEach(e=>{
    const d=new Date(e.created_at);
    const key=`${d.getFullYear()}/${String(d.getMonth()+1).padStart(2,'0')}`;
    if(!monthMap[key])monthMap[key]={count:0,emotions:{}};
    monthMap[key].count++;
    const a=(e.analyses||[])[0];
    if(a?.emotion_wheel)a.emotion_wheel.forEach(em=>{
      monthMap[key].emotions[em.category]=(monthMap[key].emotions[em.category]||0)+1;
    });
  });
  const months=Object.entries(monthMap).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,6);
  const maxCount=Math.max(...months.map(m=>m[1].count),1);
  let html=`<div class="result-card">
    <div class="report-stats">
      <div class="report-stat"><div class="report-stat-num">${entries.length}</div><div class="report-stat-lbl">累計記録数</div></div>
      <div class="report-stat"><div class="report-stat-num">${months[0]?.[1]?.count||0}</div><div class="report-stat-lbl">今月の記録</div></div>
      <div class="report-stat"><div class="report-stat-num">${months.length}</div><div class="report-stat-lbl">記録月数</div></div>
    </div>
  </div>
  <div class="result-card">
    <div class="result-label">月別記録数（直近6ヶ月）</div>
    ${months.map(([key,data])=>`
      <div class="report-month-row">
        <div class="report-month-name">${key}</div>
        <div class="report-month-bar"><div class="report-month-fill" style="width:${Math.round((data.count/maxCount)*100)}%"></div></div>
        <div class="report-month-count">${data.count}件</div>
      </div>`).join('')}
  </div>
  ${months.map(([key,data])=>{
    const top=Object.entries(data.emotions).sort((a,b)=>b[1]-a[1]).slice(0,3);
    if(!top.length)return'';
    return`<div class="result-card">
      <div class="result-label">${key} よく感じた感情</div>
      <div class="emotion-chips">${top.map(([cat])=>`
        <div class="emotion-chip" style="background:${EMOTION_COLORS[cat]||'#8a7a72'}">
          <div class="emotion-chip-name">${esc(cat)}</div>
        </div>`).join('')}
      </div>
    </div>`;
  }).join('')}`;
  main.innerHTML=html;
}

/* ===== SNSシェア ===== */
function ctxWrapText(ctx,text,x,y,maxW,lineH){
  const lines=[];let line='';
  for(const c of[...text]){
    const t=line+c;
    if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=c;}
    else line=t;
  }
  if(line)lines.push(line);
  lines.forEach((l,i)=>ctx.fillText(l,x,y+i*lineH));
  return lines.length;
}

function rrFill(ctx,x,y,w,h,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);
  ctx.closePath();ctx.fill();
}

function ctxWrapCenter(ctx,text,cx,y,maxW,lineH){
  const lines=[];let line='';
  for(const c of[...text]){
    const t=line+c;
    if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=c;}
    else line=t;
  }
  if(line)lines.push(line);
  const saved=ctx.textAlign;ctx.textAlign='center';
  lines.forEach((l,i)=>ctx.fillText(l,cx,y+i*lineH));
  ctx.textAlign=saved;
  return lines.length;
}

async function generateShareCard(analysis){
  const type=determineType(analysis);
  const W=1080,H=1080;
  const canvas=document.createElement('canvas');
  canvas.width=W;canvas.height=H;
  const ctx=canvas.getContext('2d');
  try{await document.fonts.ready;}catch(e){}

  // ─── 背景グラデーション ───
  const grad=ctx.createLinearGradient(0,0,W,H);
  grad.addColorStop(0,type.color);
  grad.addColorStop(1,type.subcolor);
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);

  // 薄い下部オーバーレイ（フッター可読性UP）
  const fgrad=ctx.createLinearGradient(0,H-260,0,H);
  fgrad.addColorStop(0,'rgba(0,0,0,0)');fgrad.addColorStop(1,'rgba(0,0,0,0.3)');
  ctx.fillStyle=fgrad;ctx.fillRect(0,H-260,W,260);

  // トップバー
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(0,0,W,96);

  // ─── アプリ名 ───
  ctx.textAlign='center';
  ctx.fillStyle='rgba(255,255,255,.85)';
  ctx.font=`600 30px 'Shippori Mincho', serif`;
  ctx.fillText('本音ルーム  感情タイプ診断',W/2,60);

  // ─── 絵文字 ───
  ctx.font=`${Math.round(W*.13)}px serif`;
  ctx.fillText(type.emoji,W/2,308);

  // ─── "あなたのタイプは" ───
  ctx.fillStyle='rgba(255,255,255,.7)';
  ctx.font=`300 32px 'DM Sans', sans-serif`;
  ctx.fillText('あなたのタイプは',W/2,390);

  // ─── タイプ名 ───
  ctx.fillStyle='white';
  ctx.font=`700 78px 'Shippori Mincho', serif`;
  if(ctx.measureText(type.name).width>W-120){
    ctx.font=`700 58px 'Shippori Mincho', serif`;
  }
  ctx.fillText(type.name,W/2,486);

  // ─── タグライン ───
  ctx.fillStyle='rgba(255,255,255,.82)';
  ctx.font=`300 33px 'DM Sans', sans-serif`;
  ctxWrapCenter(ctx,type.tagline,W/2,556,W-160,48);

  // ─── 区切り ───
  ctx.strokeStyle='rgba(255,255,255,.28)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(W/2-220,618);ctx.lineTo(W/2+220,618);ctx.stroke();

  // ─── インサイト ───
  ctx.fillStyle='white';
  ctx.font=`600 40px 'Shippori Mincho', serif`;
  ctx.fillText(`「${type.insight}」`,W/2,698);

  // ─── フッター ───
  ctx.strokeStyle='rgba(255,255,255,.2)';ctx.lineWidth=1;
  ctx.beginPath();ctx.moveTo(100,894);ctx.lineTo(W-100,894);ctx.stroke();

  ctx.fillStyle='rgba(255,255,255,.9)';
  ctx.font=`600 28px 'Shippori Mincho', serif`;
  ctx.fillText('あなたのタイプは？',W/2,950);
  ctx.fillStyle='rgba(255,255,255,.65)';
  ctx.font=`300 24px 'DM Sans', sans-serif`;
  ctx.fillText('app.honneroom.com',W/2,992);
  ctx.font=`300 21px 'DM Sans', sans-serif`;
  ctx.fillText('#本音ルーム  #感情タイプ診断',W/2,1032);

  ctx.textAlign='left';
  return canvas.toDataURL('image/png');
}

async function showShareModal(analysis){
  const modal=document.getElementById('shareModal');
  const preview=document.getElementById('sharePreviewImg');
  const generating=document.getElementById('shareGenerating');
  const btnDl=document.getElementById('shareBtnDl');
  const btnX=document.getElementById('shareBtnX');
  const btnLine=document.getElementById('shareBtnLine');
  const btnCopy=document.getElementById('shareBtnCopy');
  if(!modal||!analysis)return;

  // モーダル表示・リセット
  modal.classList.add('show');
  preview.style.display='none';generating.style.display='';
  [btnDl,btnX,btnLine,btnCopy].forEach(b=>b.style.display='none');

  let dataUrl='';
  try{
    dataUrl=await generateShareCard(analysis);
    preview.src=dataUrl;preview.style.display='block';
    generating.style.display='none';
    [btnDl,btnX,btnLine,btnCopy].forEach(b=>b.style.display='');

    // タイプ名ベースのシェアテキスト（個人内容を含まない）
    const type=determineType(analysis);
    const shareText=`【感情タイプ診断】\n私は「${type.name}」でした！\n${type.tagline}\n\n#本音ルーム #感情タイプ診断\nあなたのタイプは？→ https://app.honneroom.com`;

    // Web Share API（モバイルで画像ごと共有）
    if(navigator.share&&dataUrl){
      try{
        const blob=await(await fetch(dataUrl)).blob();
        const file=new File([blob],'honneroom-type.png',{type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[file]})){
          btnDl.textContent='📲 シェア / 保存する';
          btnDl.onclick=async()=>{
            await navigator.share({title:`私は「${type.name}」でした！`,text:shareText,files:[file]}).catch(()=>{});
          };
          btnX.style.display='none';btnLine.style.display='none';btnCopy.style.display='none';
          return;
        }
      }catch(e){}
    }

    // PC / フォールバック
    btnDl.onclick=()=>{
      const a=document.createElement('a');a.href=dataUrl;a.download=`honneroom-${type.id}.png`;a.click();
    };
    const tweetText=encodeURIComponent(`私の感情タイプは「${type.name}」でした！\n${type.tagline}\n#本音ルーム #感情タイプ診断\nあなたのタイプは？→ https://app.honneroom.com`);
    btnX.onclick=()=>window.open(`https://x.com/intent/tweet?text=${tweetText}`,'_blank');
    const lineText=encodeURIComponent(`私の感情タイプは「${type.name}」でした！\nあなたのタイプは？→ https://app.honneroom.com`);
    btnLine.onclick=()=>window.open(`https://line.me/R/msg/text/?${lineText}`,'_blank');
    btnCopy.onclick=()=>{
      navigator.clipboard.writeText(shareText).then(()=>{btnCopy.textContent='✓ コピーしました！';setTimeout(()=>{btnCopy.textContent='📋 テキストをコピー';},2000);});
    };
  }catch(e){
    console.error('generateShareCard error:',e);
    generating.textContent='画像の生成に失敗しました。';
  }
}

function openIconPickerModal(currentUrl){
  const old=document.getElementById("iconPickerModal");if(old)old.remove();
  const overlay=document.createElement("div");overlay.id="iconPickerModal";overlay.className="icon-modal-overlay show";
  let tempSelected=currentUrl||DEFAULT_ICON;
  const defaultChecked=(!currentUrl||currentUrl===DEFAULT_ICON)?" checked":"";
  let gridHtml=`<label class="icon-option"><input type="radio" name="iconPickModal" value="${DEFAULT_ICON}"${defaultChecked}><img src="${DEFAULT_ICON}" alt="" style="opacity:.7"></label>`;
  gridHtml+=S.ICONS.map(url=>{
    const checked=(currentUrl===url)?" checked":"";
    return`<label class="icon-option"><input type="radio" name="iconPickModal" value="${esc(url)}"${checked}><img src="${esc(url)}" alt=""></label>`;
  }).join("");
  overlay.innerHTML=`<div class="icon-modal"><button class="icon-modal-close" id="iconModalClose">×</button><div class="icon-modal-title">アイコンを選ぶ</div><div class="icon-picker-grid">${gridHtml}</div><div class="icon-modal-btns"><button class="btn-p" id="iconModalOk">決定</button><button class="btn-s" id="iconModalCancel">キャンセル</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelectorAll("input[name=iconPickModal]").forEach(r=>{r.addEventListener("change",()=>{tempSelected=r.value;});});
  overlay.querySelector("#iconModalOk").addEventListener("click",()=>{
    const iconUrl=tempSelected||DEFAULT_ICON;
    const prev=$("#avPreview");if(prev)prev.innerHTML=`<img src="${esc(iconUrl)}" alt="">`;
    const h=$("#selectedIconVal");if(h)h.value=iconUrl;
    overlay.remove();
  });
  const close=()=>overlay.remove();
  overlay.querySelector("#iconModalClose").addEventListener("click",close);
  overlay.querySelector("#iconModalCancel").addEventListener("click",close);
  overlay.addEventListener("click",e=>{if(e.target===overlay)close();});
}

document.getElementById('pwaBannerClose').addEventListener('click',()=>{
  document.getElementById('pwaBanner').classList.remove('show');
  sessionStorage.setItem('pwaBannerDismissed','1');
});
document.getElementById('pwaModalClose').addEventListener('click',()=>document.getElementById('pwaModal').classList.remove('show'));
document.getElementById('pwaModal').addEventListener('click',e=>{
  if(e.target===document.getElementById('pwaModal')) document.getElementById('pwaModal').classList.remove('show');
});
</script>
</body>
</html>
